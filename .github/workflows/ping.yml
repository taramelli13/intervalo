# Mantém o projeto Supabase acordado no feriado (D-024): o plano gratuito
# pausa por inatividade, e piloto com paciente registrando não pode dormir.
name: ping semanal
on:
  schedule:
    - cron: "0 9 * * 1,4" # segunda e quinta, 9h UTC
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sf "${{ secrets.SUPABASE_URL }}/rest/v1/perfis?select=papel&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" -o /dev/null
